<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login page</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="continer">
      <div class="continer-form">
        <form class="sing-in">
          <h2>Iniciar sesión</h2>
          <div class="social-networks">
            <ion-icon name="fitness-outline"></ion-icon>
          </div>
          <span>Use su correo y contraseña</span>
          <div class="continer-input">
            <ion-icon name="mail-open-outline"></ion-icon>
            <input type="email" placeholder="Correo" required />
          </div>
          <div class="continer-input">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" placeholder="Contraseña" required />
          </div>
          <a href="#">¿Olvidaste tu contraseña?</a>
          <a href="/pages/components/sidebar.html" class="button"
            >Iniciar sesión</a
          >
        </form>
      </div>
      <div class="continer-welcome">
        <div class="welcome">
          <h3>Bienvenido a Farmacia Génesis</h3>
          <p>Inicia sesión para acceder a tu panel de control.</p>
        </div>
      </div>
    </div>
    <footer class="footer">Farmacia Génesis-Jinotepe</footer>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
